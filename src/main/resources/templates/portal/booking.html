<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/site :: layout(${booking.bookingNo}, ~{::main}, 'p-bookings')}">
<body>
<main>
  <div class="page-head">
    <div class="grow"><div class="crumbs"><a th:href="@{/portal/bookings}">My bookings</a></div>
      <h1><span th:text="${booking.bookingNo}">BK</span> <span th:replace="~{fragments/components :: badge(${booking.status})}"></span></h1>
      <span class="muted" th:text="${booking.status.description}"></span></div>
    <div class="actions">
      <a class="btn btn-outline" th:if="${inspection != null}" th:href="@{/portal/inspections/{id}(id=${job.id})}">Inspection report</a>
      <a class="btn btn-primary" th:if="${invoice != null}" th:href="@{/portal/invoices/{id}(id=${invoice.id})}">Invoice</a>
    </div>
  </div>
  <div class="card"><div th:replace="~{fragments/components :: timeline(${booking})}"></div></div>

  <div class="card" th:if="${estimates != null and !#lists.isEmpty(estimates)}">
    <h2>Estimates</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Estimate</th><th>Sent</th><th class="num">Amount</th><th>Status</th><th></th></tr></thead>
      <tbody><tr th:each="e : ${estimates}">
        <td th:text="${e.estimateNo}">EST</td><td th:text="${@fmt.dateTime(e.sentAt)}">-</td>
        <td class="num" th:text="${@fmt.money(e.grandTotal)}">0</td>
        <td><span th:replace="~{fragments/components :: badge(${e.status})}"></span></td>
        <td class="right"><a class="btn btn-sm" th:classappend="${e.pending} ? 'btn-primary' : 'btn-outline'" th:href="@{/portal/estimates/{id}(id=${e.id})}" th:text="${e.pending} ? 'Review &amp; approve' : 'View'">View</a></td>
      </tr></tbody></table></div>
  </div>

  <div class="grid g2">
    <div class="card"><h2>Details</h2><dl class="kv">
      <dt>Vehicle</dt><dd><span class="plate" th:text="${booking.vehicle.regNo}">MH12</span> <span th:text="${booking.vehicle.displayName}"></span></dd>
      <dt>Scheduled</dt><dd th:text="${@fmt.dateTime(booking.preferredAt)}">-</dd>
      <dt>Services</dt><dd th:text="${booking.serviceNames}">-</dd>
      <dt>Your note</dt><dd th:text="${booking.complaint != null ? booking.complaint : '-'}">-</dd>
      <dt>Pickup &amp; drop</dt><dd th:text="${booking.pickupRequired ? 'Yes - ' + booking.pickupAddress : 'No'}">-</dd>
      <dt th:if="${booking.cancelReason != null}">Cancel reason</dt><dd th:if="${booking.cancelReason != null}" th:text="${booking.cancelReason}"></dd>
    </dl>
      <div th:if="${!#lists.isEmpty(pickups)}" class="mt"><h3>Pickup &amp; drop</h3>
        <div th:each="p : ${pickups}"><span th:text="${p.type.label}">Pickup</span>
          <span th:replace="~{fragments/components :: badge(${p.status})}"></span>
          <small class="muted" th:if="${p.driver != null}" th:text="${' - ' + p.driver.name + ' ' + p.driver.phone}"></small></div></div>
    </div>
    <div class="card" th:if="${canCancel}"><h2>Change of plans?</h2>
      <form th:action="@{/portal/bookings/{id}/reschedule(id=${booking.id})}" method="post">
        <div class="field"><label for="when">New date &amp; time</label>
          <input type="datetime-local" id="when" name="when" th:value="${@fmt.inputDateTime(booking.preferredAt)}" required></div>
        <button class="btn btn-outline" type="submit">Reschedule</button>
      </form>
      <form th:action="@{/portal/bookings/{id}/cancel(id=${booking.id})}" method="post" class="mt" data-confirm="Cancel this booking?">
        <div class="field"><label for="reason">Reason (optional)</label><input type="text" id="reason" name="reason" maxlength="300"></div>
        <button class="btn btn-danger" type="submit">Cancel booking</button>
      </form>
    </div>
  </div>

  <div class="card" th:if="${review != null}">
    <h2>Your feedback</h2>
    <span th:replace="~{fragments/components :: stars(${review.rating})}"></span>
    <p th:text="${review.reviewText}">-</p>
    <p class="muted" th:if="${review.reply != null}" th:text="'Reply from ' + ${garage.name} + ': ' + ${review.reply}"></p>
  </div>
  <div class="card" th:if="${canReview}">
    <h2>How was your service?</h2>
    <form th:action="@{/portal/bookings/{id}/feedback(id=${booking.id})}" th:object="${feedbackForm}" method="post">
      <div class="field"><label for="rating">Rating</label>
        <select th:field="*{rating}"><option value="">Select</option>
          <option value="5">5 - Excellent</option><option value="4">4 - Good</option><option value="3">3 - Average</option>
          <option value="2">2 - Poor</option><option value="1">1 - Very poor</option></select></div>
      <div class="field"><label for="reviewText">Comments</label><textarea th:field="*{reviewText}"></textarea></div>
      <button class="btn btn-primary" type="submit">Submit feedback</button>
    </form>
  </div>
</main>
</body>
</html>
