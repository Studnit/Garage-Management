<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/site :: layout('Change password', ~{::main}, 'account')}">
<body>
<main class="narrow">
  <div class="card">
    <h1>Change password</h1>
    <div class="alert alert-warn" th:if="${forced}">You are using a temporary password. Please choose your own password to continue.</div>
    <div class="alert alert-danger" th:if="${error != null}" th:text="${error}">Error</div>
    <form th:action="@{/account/password}" th:object="${form}" method="post" novalidate>
      <div th:replace="~{fragments/components :: formerrors}"></div>
      <div class="stack" style="gap:.9rem">
        <div th:replace="~{fragments/components :: input('Current password', 'current', 'password')}"></div>
        <div th:replace="~{fragments/components :: input('New password (min 8, letters and numbers)', 'password', 'password')}"></div>
        <div th:replace="~{fragments/components :: input('Confirm new password', 'confirm', 'password')}"></div>
      </div>
      <div class="btn-row mt">
        <button class="btn btn-primary" type="submit">Update password</button>
      </div>
    </form>
    <form th:action="@{/logout}" method="post" class="mt" th:if="${forced}" data-no-loading>
      <button class="link-btn" type="submit">Sign out instead</button>
    </form>
  </div>
</main>
</body>
</html>
