<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/site :: layout('Access denied', ~{::main}, 'error')}">
<body>
<main class="error-page">
  <div class="code">403</div>
  <h1>Access denied</h1>
  <p class="muted">Your role does not have permission to open this page. If you think this is a mistake, please contact the garage manager.</p>
  <div class="btn-row" style="justify-content:center">
    <a class="btn btn-primary" th:href="@{/}">Go to home</a>
    <a class="btn btn-outline" th:href="@{/admin}" sec:authorize="hasAnyRole('SUPER_ADMIN','GARAGE_MANAGER','SERVICE_ADVISOR','MECHANIC','ACCOUNTANT','INVENTORY_MANAGER')">Staff dashboard</a>
    <a class="btn btn-outline" th:href="@{/portal}" sec:authorize="hasRole('CUSTOMER')">My dashboard</a>
  </div>
</main>
</body>
</html>
