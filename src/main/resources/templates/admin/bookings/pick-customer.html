<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/staff :: layout('New booking', ~{::main}, 'bookings')}">
<body>
<main>
  <div class="page-head"><div class="grow"><h1>New booking</h1><span class="muted">Step 1 of 2 - choose the customer</span></div>
    <div class="actions"><a class="btn btn-outline" th:href="@{/admin/customers/new}">+ New customer</a></div></div>
  <form class="filters" th:action="@{/admin/bookings/new}" method="get">
    <div class="field grow search"><label for="q">Find customer by name or mobile</label>
      <input type="text" id="q" name="q" th:value="${q}" placeholder="Search..." autofocus></div>
    <button class="btn btn-primary" type="submit">Search</button>
  </form>
  <th:block th:if="${#lists.isEmpty(customers)}"><div th:replace="~{fragments/components :: empty('&#128101;', 'No customers found', 'Add the customer first, then book a service.')}"></div></th:block>
  <div class="table-wrap" th:unless="${#lists.isEmpty(customers)}">
    <table>
      <thead><tr><th>Customer</th><th>Mobile</th><th class="num">Vehicles</th><th></th></tr></thead>
      <tbody>
        <tr th:each="c : ${customers}">
          <td th:text="${c.name}">Name</td><td th:text="${c.mobile}">98</td>
          <td class="num" th:text="${#lists.size(c.vehicles)}">1</td>
          <td class="right"><a class="btn btn-primary btn-sm" th:href="@{/admin/bookings/new(customerId=${c.id})}">Select</a></td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
