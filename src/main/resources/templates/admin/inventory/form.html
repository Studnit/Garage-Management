<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/staff :: layout(${isNew} ? 'New part' : 'Edit part', ~{::main}, 'inventory')}">
<body>
<main>
  <div class="page-head"><div class="grow">
    <div class="crumbs"><a th:href="@{/admin/inventory}">Inventory</a></div>
    <h1 th:text="${isNew} ? 'New spare part' : 'Edit spare part'">Part</h1></div></div>
  <div class="alert alert-danger" th:if="${error != null}" th:text="${error}">Error</div>
  <div class="card">
    <form th:action="@{${formAction}}" th:object="${form}" method="post" novalidate>
      <div th:replace="~{fragments/components :: formerrors}"></div>
      <div class="form-grid">
        <div th:replace="~{fragments/components :: input('Part number *', 'partNo', 'text')}"></div>
        <div th:replace="~{fragments/components :: input('Name *', 'name', 'text')}"></div>
        <div th:replace="~{fragments/components :: input('Brand', 'brand', 'text')}"></div>
        <div th:replace="~{fragments/components :: input('Category (e.g. Filters, Brakes)', 'category', 'text')}"></div>
        <div class="full" th:replace="~{fragments/components :: input('Compatible vehicles', 'compatibility', 'text')}"></div>
        <div th:replace="~{fragments/components :: input('Purchase price (₹)', 'purchasePrice', 'number')}"></div>
        <div th:replace="~{fragments/components :: input('Selling price (₹, excl. GST) *', 'sellingPrice', 'number')}"></div>
        <div th:replace="~{fragments/components :: input('GST %', 'gstRate', 'number')}"></div>
        <div th:replace="~{fragments/components :: input('HSN code', 'hsnCode', 'text')}"></div>
        <div th:replace="~{fragments/components :: input('Minimum stock (reorder level)', 'minStock', 'number')}"></div>
        <th:block th:if="${isNew}"><div th:replace="~{fragments/components :: input('Opening stock', 'openingStock', 'number')}"></div></th:block>
        <div th:replace="~{fragments/components :: input('Unit', 'unit', 'text')}"></div>
        <div th:replace="~{fragments/components :: input('Rack / bin location', 'rackLocation', 'text')}"></div>
        <div class="field"><label for="supplierId">Preferred supplier</label>
          <select th:field="*{supplierId}"><option value="">None</option>
            <option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.name}">Supplier</option></select></div>
        <div class="field"><span class="label">Status</span><label class="check"><input type="checkbox" th:field="*{active}"> Active (available for job cards)</label></div>
      </div>
      <div class="btn-row mt">
        <button class="btn btn-primary" type="submit">Save part</button>
        <a class="btn btn-outline" th:href="${isNew} ? @{/admin/inventory} : @{/admin/inventory/{id}(id=${part.id})}">Cancel</a>
      </div>
    </form>
  </div>
</main>
</body>
</html>
