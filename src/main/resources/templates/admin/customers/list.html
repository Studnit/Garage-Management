<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/staff :: layout('Customers', ~{::main}, 'customers')}">
<body>
<main>
  <div class="page-head">
    <div class="grow"><h1>Customers</h1><span class="muted"><span data-filter-count th:text="${#lists.size(customers)}">0</span> shown</span></div>
    <div class="actions"><a class="btn btn-primary" th:href="@{/admin/customers/new}">+ New customer</a></div>
  </div>
  <form class="filters" th:action="@{/admin/customers}" method="get" data-no-loading>
    <div class="field grow search"><label for="q">Search by name, mobile, email or code</label>
      <input type="text" id="q" name="q" th:value="${q}" placeholder="Search customers..." data-filter="#customerTable"></div>
    <button class="btn" type="submit">Search</button>
    <a class="btn btn-outline" th:href="@{/admin/customers}" th:if="${q != null}">Clear</a>
  </form>
  <th:block th:if="${#lists.isEmpty(customers)}"><div class="card" th:replace="~{fragments/components :: empty('&#128101;', 'No customers found', 'Add your first customer to get started.')}"></div></th:block>
  <div class="table-wrap" th:unless="${#lists.isEmpty(customers)}">
    <table id="customerTable">
      <thead><tr><th data-sort>Code</th><th data-sort>Customer</th><th data-sort>Mobile</th><th data-sort>Email</th><th data-sort class="num">Vehicles</th><th>Portal</th><th data-sort>Joined</th></tr></thead>
      <tbody>
        <tr th:each="c : ${customers}" class="row-link" th:attr="data-href=@{/admin/customers/{id}(id=${c.id})}">
          <td class="mono" th:text="${c.code}">CUS-00001</td>
          <td><a th:href="@{/admin/customers/{id}(id=${c.id})}" th:text="${c.name}">Name</a></td>
          <td th:text="${c.mobile}">98</td>
          <td th:text="${c.email}">mail</td>
          <td class="num" th:text="${#lists.size(c.vehicles)}">1</td>
          <td><span class="badge b-green" th:if="${c.portalEnabled}">Active</span><span class="badge b-gray" th:unless="${c.portalEnabled}">Walk-in</span></td>
          <td th:text="${@fmt.date(c.createdAt.toLocalDate())}">date</td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
