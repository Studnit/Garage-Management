<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/staff :: layout(${isNew} ? 'New user' : 'Edit user', ~{::main}, 'users')}">
<body>
<main>
  <div class="page-head"><div class="grow"><div class="crumbs"><a th:href="@{/admin/users}">Users</a></div>
    <h1 th:text="${isNew} ? 'New staff user' : 'Edit user'">User</h1></div></div>
  <div class="alert alert-danger" th:if="${error != null}" th:text="${error}">Error</div>
  <div class="card">
    <form th:action="@{${formAction}}" th:object="${form}" method="post" novalidate>
      <div th:replace="~{fragments/components :: formerrors}"></div>
      <div class="form-grid">
        <div th:replace="~{fragments/components :: input('Full name *', 'fullName', 'text')}"></div>
        <div th:replace="~{fragments/components :: input('Email (login) *', 'email', 'email')}"></div>
        <div th:replace="~{fragments/components :: input('Phone', 'phone', 'tel')}"></div>
        <div class="field"><label for="role">Role</label>
          <select th:field="*{role}"><option th:each="r : ${roles}" th:if="${r.name() != 'CUSTOMER'}" th:value="${r.name()}" th:text="${r.label}">Role</option></select></div>
        <th:block th:if="${isNew}"><div th:replace="~{fragments/components :: input('Password (leave blank to generate a temporary one)', 'password', 'password')}"></div></th:block>
        <div class="field"><span class="label">Account</span><label class="check"><input type="checkbox" th:field="*{enabled}"> Enabled</label></div>
      </div>
      <div class="btn-row mt">
        <button class="btn btn-primary" type="submit">Save user</button>
        <a class="btn btn-outline" th:href="@{/admin/users}">Cancel</a>
      </div>
    </form>
  </div>
</main>
</body>
</html>
