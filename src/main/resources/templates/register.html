<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/site :: layout('Create account', ~{::main}, 'register')}">
<body>
<main class="wide-narrow">
  <div class="card">
    <h1>Create your account</h1>
    <p class="muted">Register once to book services, track your vehicle, approve repairs and download invoices.</p>
    <div class="alert alert-danger" th:if="${error != null}" th:text="${error}">Error</div>
    <form th:action="@{/register}" th:object="${form}" method="post" novalidate>
      <div th:replace="~{fragments/components :: formerrors}"></div>
      <div class="form-grid">
        <div th:replace="~{fragments/components :: input('Full name *', 'fullName', 'text')}"></div>
        <div th:replace="~{fragments/components :: input('Mobile number *', 'mobile', 'tel')}"></div>
        <div class="full" th:replace="~{fragments/components :: input('Email (used to sign in) *', 'email', 'email')}"></div>
        <div th:replace="~{fragments/components :: input('Password * (min 8, letters and numbers)', 'password', 'password')}"></div>
        <div th:replace="~{fragments/components :: input('Confirm password *', 'confirmPassword', 'password')}"></div>
        <div class="full" th:replace="~{fragments/components :: textarea('Address (helpful for pickup & drop)', 'address')}"></div>
      </div>
      <div class="btn-row mt">
        <button class="btn btn-primary" type="submit">Create account</button>
        <a class="btn btn-outline" th:href="@{/login}">I already have an account</a>
      </div>
    </form>
  </div>
</main>
</body>
</html>
